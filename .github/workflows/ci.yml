name: CI

on:
  push:
    branches: [main, nredd/v1.3.0, "security/**"]
  pull_request:
    branches: [main, nredd/v1.3.0]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      # Trusted ref comparisons only; never interpolate PR-controlled text into commands.
      IS_FORK_REF: ${{ github.base_ref == 'nredd/v1.3.0' || github.ref_name == 'nredd/v1.3.0' || startsWith(github.ref_name, 'security/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit every fork dependency lock including development tools
        if: env.IS_FORK_REF == 'true'
        run: |
          set -euo pipefail
          git ls-files -z -- package-lock.json '**/package-lock.json' >"$RUNNER_TEMP/npm-lockfiles"
          test -s "$RUNNER_TEMP/npm-lockfiles"
          while IFS= read -r -d '' lockfile; do
            opts=(--package-lock-only --audit-level=info --prefix "$(dirname "$lockfile")")
            if [[ "$lockfile" != package-lock.json ]]; then
              opts+=(--workspaces=false)
            fi
            npm audit "${opts[@]}"
          done <"$RUNNER_TEMP/npm-lockfiles"

      # Fork branch: freeze model data to the published pi-ai release instead of fetching it live.
      - name: Restore the release model data
        if: env.IS_FORK_REF == 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/coding-agent/package.json').version")
          npm pack "@earendil-works/pi-ai@$version" --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/earendil-works-pi-ai-$version.tgz" -C "$RUNNER_TEMP"
          rm -rf packages/ai/src/providers/data
          cp -R "$RUNNER_TEMP/package/dist/providers/data" packages/ai/src/providers/data

      - name: Build
        if: env.IS_FORK_REF != 'true'
        run: npm run build

      - name: Build offline
        if: env.IS_FORK_REF == 'true'
        run: npm run build:offline

      # Previews are published for main, release tags and PRs from branches of this repo only (see preview-packages.yml).
      - name: Pack preview packages
        if: env.IS_FORK_REF != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          # Pull request runs check out a merge commit; tarballs are keyed by the PR head commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/preview-packages.mjs pack --sha "$SHA" --out "$RUNNER_TEMP/preview-packages"

      - name: Upload preview packages
        if: env.IS_FORK_REF != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages
          retention-days: 3
          if-no-files-found: error

      - name: Check
        run: npm run check

      # The checkout has no tags; the released changelog sections are compared with the newest release tag.
      - name: Fetch the newest release tag
        if: env.IS_FORK_REF != 'true'
        run: |
          tag=$(git ls-remote --tags --sort=-v:refname origin 'v*.*.*' | grep -v '\^{}' | head -1 | sed 's#.*refs/tags/##')
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"

      - name: Check released changelog sections
        if: env.IS_FORK_REF != 'true'
        run: npm run check:released-changelogs

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      # Trusted ref comparisons only; never interpolate PR-controlled text into commands.
      IS_FORK_REF: ${{ github.base_ref == 'nredd/v1.3.0' || github.ref_name == 'nredd/v1.3.0' || startsWith(github.ref_name, 'security/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        if: matrix.name != 'durable'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit every fork dependency lock including development tools
        if: env.IS_FORK_REF == 'true'
        run: |
          set -euo pipefail
          git ls-files -z -- package-lock.json '**/package-lock.json' >"$RUNNER_TEMP/npm-lockfiles"
          test -s "$RUNNER_TEMP/npm-lockfiles"
          while IFS= read -r -d '' lockfile; do
            opts=(--package-lock-only --audit-level=info --prefix "$(dirname "$lockfile")")
            if [[ "$lockfile" != package-lock.json ]]; then
              opts+=(--workspaces=false)
            fi
            npm audit "${opts[@]}"
          done <"$RUNNER_TEMP/npm-lockfiles"

      # Fork branch: freeze model data to the published pi-ai release instead of fetching it live.
      - name: Restore the release model data
        if: env.IS_FORK_REF == 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/coding-agent/package.json').version")
          npm pack "@earendil-works/pi-ai@$version" --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/earendil-works-pi-ai-$version.tgz" -C "$RUNNER_TEMP"
          rm -rf packages/ai/src/providers/data
          cp -R "$RUNNER_TEMP/package/dist/providers/data" packages/ai/src/providers/data

      - name: Build
        if: env.IS_FORK_REF != 'true'
        run: npm run build

      - name: Build offline
        if: env.IS_FORK_REF == 'true'
        run: npm run build:offline

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Test
        if: env.IS_FORK_REF != 'true'
        run: scripts/ci-test-suite.sh "${{ matrix.name }}"

      - name: Test in an isolated home
        if: env.IS_FORK_REF == 'true'
        run: ./test.sh scripts/ci-test-suite.sh "${{ matrix.name }}"

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
